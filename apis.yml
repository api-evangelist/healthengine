name: HealthEngine

kind: company

description: >-
  HealthEngine is Australia's largest consumer healthcare marketplace and
  patient-engagement platform, founded in 2006 and headquartered in Perth,
  Western Australia. Its consumer app and website let millions of Australians
  search a national directory of primary-care providers and book, manage, and
  attend appointments (including telehealth) across GP, dental, allied-health,
  and specialist practices. For practices, HealthEngine sells a SaaS suite -
  GP Complete, Patient Connect, Online Booking, Appointment Reminders and
  Recalls, Featured Listings, online payments, patient reviews, and Scripts -
  that plugs into the practice's existing software. It maintains private,
  real-time integrations into 25+ Australian practice management systems
  (Best Practice / Bp Premier, MedicalDirector Pracsoft, Zedmed, Cliniko,
  Genie, Gentu, Medtech, Nookal, PracSuite, Dental4Windows, and others) so
  appointment availability and bookings sync directly with the front desk.
  Home market is Australia. HealthEngine does NOT publish a public developer
  portal, REST OpenAPI, or HL7 FHIR endpoint - its API surface is a set of
  gated, partner-only PMS integrations rather than a self-serve developer
  program, so this profile is an honest identity stub with no public
  machine-readable contract to harvest.

